    <script type="module">
      // During Vite dev, expose VITE_* vars to window.__ENV__ if not already set by server
      try {
        const existing = window.__ENV__ || {};
        const env = import.meta.env || {};
        const viteVars = Object.fromEntries(Object.entries(env).filter(([k]) => k.startsWith('VITE_')));
        window.__ENV__ = { ...viteVars, ...existing };
        
      } catch (e) {
        console.error('❌ Environment setup error:', e);
      }
